name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125"

      - name: Build Rust core for Android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
        run: |
          cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build --release -p readme-ffi

      - name: Generate Kotlin bindings (UniFFI)
        run: |
          cargo build --release -p readme-ffi
          cargo run --release -p readme-ffi --bin uniffi-bindgen -- generate \
            --library target/release/libreadme_ffi.so \
            --language kotlin \
            --out-dir android/app/src/main/java

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        run: gradle -p android :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: read-me-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
